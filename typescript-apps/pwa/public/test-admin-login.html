<!DOCTYPE html>
<html>
<head>
    <title>Admin Login Test</title>
</head>
<body>
    <h1>Admin Login Test</h1>
    <div>
        <label>Email:</label>
        <input type="email" id="email" value="admin@wali.com" />
    </div>
    <div>
        <label>Password:</label>
        <input type="password" id="password" value="admin123" />
    </div>
    <button onclick="login()">Login</button>
    <pre id="result"></pre>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultEl = document.getElementById('result');
            
            try {
                console.log('Attempting login to http://localhost:8000/auth/admin/login');
                const response = await fetch('http://localhost:8000/auth/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                resultEl.textContent = `Status: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultEl.textContent = `Error: ${error.message}`;
                console.error(error);
            }
        }
    </script>
</body>
</html>
