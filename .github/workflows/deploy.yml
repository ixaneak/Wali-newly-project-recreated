name: WALI Production Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, '[deploy-')"
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      # Deploy Policy Service
      - name: Deploy Policy Service
        if: "contains(github.event.head_commit.message, '[deploy-policy]') || contains(github.event.head_commit.message, '[deploy-all]')"
        run: |
          cd python-services/policy-service
          flyctl deploy --remote-only
          
      # Deploy Claims Service
      - name: Deploy Claims Service
        if: "contains(github.event.head_commit.message, '[deploy-claims]') || contains(github.event.head_commit.message, '[deploy-all]')"
        run: |
          cd python-services/claims-service
          flyctl deploy --remote-only
