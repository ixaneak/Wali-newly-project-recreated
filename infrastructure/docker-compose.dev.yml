version: '3.8'

services:
  # ==================== Databases ====================
  postgres:
    image: postgis/postgis:15-3.3
    container_name: wali-postgres
    environment:
      POSTGRES_USER: wali_user
      POSTGRES_PASSWORD: wali_dev_password
      POSTGRES_DB: wali
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../shared/schemas:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wali_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: wali-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== MinIO (S3-compatible storage) ====================
  minio:
    image: minio/minio:latest
    container_name: wali-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: wali_admin
      MINIO_ROOT_PASSWORD: wali_dev_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== RabbitMQ ====================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wali-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: wali
      RABBITMQ_DEFAULT_PASS: wali_dev_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== Services (Development - Hot Reload) ====================
  policy-service:
    build:
      context: ../python-services/policy-service
      dockerfile: Dockerfile
    container_name: wali-policy-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://wali_user:wali_dev_password@postgres:5432/wali
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      ESCROW_BANK_ACCOUNT: CI12345678901234567890
      OPERATING_BANK_ACCOUNT: CI09876543210987654321
      ENVIRONMENT: development
    volumes:
      - ../python-services/policy-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

