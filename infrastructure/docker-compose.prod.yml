# Wali Platform - Production Docker Compose
# 
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml ps
#   docker-compose -f docker-compose.prod.yml logs -f

version: '3.8'

services:
  # ═════════════════════════════════════════════════════════════════
  # Reverse Proxy & SSL Termination
  # ═════════════════════════════════════════════════════════════════
  traefik:
    image: traefik:v2.10
    container_name: wali-traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@wali.ci}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--ping=true"
      - "--metrics.prometheus=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - wali-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.wali.ci`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.middlewares=auth@docker"

  # ═════════════════════════════════════════════════════════════════
  # PostgreSQL Primary (Read-Write)
  # ═════════════════════════════════════════════════════════════════
  postgres-primary:
    image: postgis/postgis:15-3.3
    container_name: wali-postgres-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wali_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wali}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    command: >
      postgres 
      -c wal_level=replica 
      -c max_wal_senders=3 
      -c max_replication_slots=3 
      -c hot_standby=on
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
    networks:
      - wali-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wali_user} -d ${POSTGRES_DB:-wali}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=false"

  # ═════════════════════════════════════════════════════════════════
  # PostgreSQL Replica (Read-Only)
  # ═════════════════════════════════════════════════════════════════
  postgres-replica:
    image: postgis/postgis:15-3.3
    container_name: wali-postgres-replica
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wali_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER:-wali_user}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >
      bash -c "
        set -e
        until pg_isready -h postgres-primary -U ${POSTGRES_USER:-wali_user}; do
          echo 'Waiting for primary...'
          sleep 2
        done
        rm -rf /var/lib/postgresql/data/*
        pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U ${POSTGRES_USER:-wali_user} -Fp -Xs -P -R
        postgres -c hot_standby=on
      "
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    networks:
      - wali-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wali_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═════════════════════════════════════════════════════════════════
  # Redis Cluster
  # ═════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: wali-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - wali-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ═════════════════════════════════════════════════════════════════
  # MinIO Object Storage
  # ═════════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: wali-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wali_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - wali-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ═════════════════════════════════════════════════════════════════
  # RabbitMQ Message Queue
  # ═════════════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wali-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wali}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wali-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ═════════════════════════════════════════════════════════════════
  # Policy Service
  # ═════════════════════════════════════════════════════════════════
  policy-service:
    build:
      context: ../python-services/policy-service
      dockerfile: Dockerfile
      target: production
    container_name: wali-policy-service
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wali_user}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB:-wali}
      DATABASE_REPLICA_URL: postgresql://${POSTGRES_USER:-wali_user}:${POSTGRES_PASSWORD}@postgres-replica:5432/${POSTGRES_DB:-wali}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: production
      ADMIN_ALERT_WEBHOOK_URL: ${ADMIN_ALERT_WEBHOOK_URL}
      ADMIN_ALERT_PHONE: ${ADMIN_ALERT_PHONE}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.policy.rule=Host(`api.wali.ci`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.policy.entrypoints=websecure"
      - "traefik.http.routers.policy.tls.certresolver=letsencrypt"
      - "traefik.http.services.policy.loadbalancer.server.port=8000"
      - "traefik.http.services.policy.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.policy.loadbalancer.healthcheck.interval=10s"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wali-network

  # ═════════════════════════════════════════════════════════════════
  # Monitoring: Prometheus
  # ═════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: wali-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - wali-network
    restart: unless-stopped

  # ═════════════════════════════════════════════════════════════════
  # Monitoring: Grafana
  # ═════════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:latest
    container_name: wali-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: https://monitoring.wali.ci
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitoring.wali.ci`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - prometheus
    networks:
      - wali-network
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════════
volumes:
  traefik_certs:
  postgres_primary_data:
    driver: local
  postgres_replica_data:
    driver: local
  redis_data:
  minio_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

# ═══════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════
networks:
  wali-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
