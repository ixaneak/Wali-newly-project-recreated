version: '3.8'

services:
  # ==================== Reverse Proxy ====================
  traefik:
    image: traefik:v2.10
    container_name: wali-traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@wali.ci"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    restart: unless-stopped

  # ==================== PostgreSQL Primary ====================
  postgres-primary:
    image: postgis/postgis:15-3.3
    container_name: wali-postgres-primary
    environment:
      POSTGRES_USER: wali_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wali
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ../../shared/schemas:/docker-entrypoint-initdb.d
    command: >
      postgres -c wal_level=replica -c max_wal_senders=3 -c max_replication_slots=3 -c hot_standby=on
    networks:
      - wali-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wali_user" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== PostgreSQL Replica ====================
  postgres-replica:
    image: postgis/postgis:15-3.3
    container_name: wali-postgres-replica
    environment:
      POSTGRES_USER: wali_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: wali_user
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >
      bash -c " until pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U wali_user -Fp -Xs -P -R; do
        echo 'Waiting for primary to be ready...'
        sleep 2
      done && postgres -c hot_standby=on "
    depends_on:
      - postgres-primary
    networks:
      - wali-network
    restart: unless-stopped

  # ==================== Redis Cluster ====================
  redis:
    image: redis:7-alpine
    container_name: wali-redis
    command: >
      redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - wali-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== MinIO Distributed ====================
  minio:
    image: minio/minio:latest
    container_name: wali-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - wali-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== RabbitMQ ====================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wali-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wali-network
    restart: unless-stopped

  # ==================== Policy Service ====================
  policy-service:
    build:
      context: ../../services/policy-service
      dockerfile: Dockerfile
    container_name: wali-policy-service
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      DATABASE_URL: postgresql://wali_user:${POSTGRES_PASSWORD}@postgres-primary:5432/wali
      DATABASE_REPLICA_URL: postgresql://wali_user:${POSTGRES_PASSWORD}@postgres-replica:5432/wali
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ESCROW_BANK_ACCOUNT: ${ESCROW_BANK_ACCOUNT}
      OPERATING_BANK_ACCOUNT: ${OPERATING_BANK_ACCOUNT}
      ENVIRONMENT: production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.policy.rule=Host(`api.wali.ci`) && PathPrefix(`/api/v1/policies`)"
      - "traefik.http.routers.policy.entrypoints=websecure"
      - "traefik.http.routers.policy.tls.certresolver=letsencrypt"
      - "traefik.http.services.policy.loadbalancer.server.port=8000"
    depends_on:
      - postgres-primary
      - redis
    networks:
      - wali-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"

  # ==================== Payment Service ====================
  payment-service:
    build:
      context: ../../services/payment-service
      dockerfile: Dockerfile
    container_name: wali-payment-service
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      DATABASE_URL: postgresql://wali_user:${POSTGRES_PASSWORD}@postgres-primary:5432/wali
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: "8080"
      ORANGE_CLIENT_ID: ${ORANGE_CLIENT_ID}
      ORANGE_CLIENT_SECRET: ${ORANGE_CLIENT_SECRET}
      MTN_API_USER: ${MTN_API_USER}
      MTN_API_KEY: ${MTN_API_KEY}
      MTN_SUBSCRIPTION_KEY: ${MTN_SUBSCRIPTION_KEY}
      MTN_TARGET_ENVIRONMENT: production
      WAVE_API_KEY: ${WAVE_API_KEY}
      WAVE_SECRET_KEY: ${WAVE_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.payment.rule=Host(`api.wali.ci`) && PathPrefix(`/api/v1/payments`, `/webhooks`)"
      - "traefik.http.routers.payment.entrypoints=websecure"
      - "traefik.http.routers.payment.tls.certresolver=letsencrypt"
      - "traefik.http.services.payment.loadbalancer.server.port=8080"
    depends_on:
      - postgres-primary
      - redis
      - rabbitmq
    networks:
      - wali-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"

  # ==================== Celery Worker ====================
  celery-worker:
    build:
      context: ../../services/compliance-service
      dockerfile: Dockerfile.worker
    container_name: wali-celery-worker
    command: celery -A app.worker worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://wali_user:${POSTGRES_PASSWORD}@postgres-primary:5432/wali
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      - postgres-primary
      - redis
      - rabbitmq
    networks:
      - wali-network
    restart: unless-stopped

  # ==================== Celery Beat (Scheduler) ====================
  celery-beat:
    build:
      context: ../../services/compliance-service
      dockerfile: Dockerfile.worker
    container_name: wali-celery-beat
    command: celery -A app.worker beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://wali_user:${POSTGRES_PASSWORD}@postgres-primary:5432/wali
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      - postgres-primary
      - redis
      - rabbitmq
    networks:
      - wali-network
    restart: unless-stopped

  # ==================== Monitoring: Prometheus ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: wali-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - wali-network
    restart: unless-stopped

  # ==================== Monitoring: Grafana ====================
  grafana:
    image: grafana/grafana:latest
    container_name: wali-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: https://monitoring.wali.ci
      TZ: Africa/Abidjan
    volumes:
      - grafana_data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitoring.wali.ci`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - prometheus
    networks:
      - wali-network
    restart: unless-stopped

volumes:
  traefik_certs:
  postgres_primary_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/encrypted/postgres_primary
  redis_data:
  minio_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:


networks:
  wali-network:
    driver: bridge
