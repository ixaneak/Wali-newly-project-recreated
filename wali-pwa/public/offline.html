<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wali - Hors Ligne</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 50px 20px; background-color: #f8fafc; color: #1e293b; }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { margin-bottom: 10px; color: #059669; }
        p { margin-bottom: 30px; line-height: 1.5; color: #64748b; }
        button { background: #059669; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #047857; }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Il semble que vous n'ayez pas de connexion internet.<br>Vérifiez votre connexion et réessayez.</p>
    <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>
