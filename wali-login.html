<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Wali - Micro-assurance pour les artisans">
    <title>Wali - Connexion</title>
    <style>
        :root {
            --primary: #00b386;
            --primary-gradient: linear-gradient(135deg, #00b386 0%, #00d9a3 100%);
            --bg-dark: #001f1f;
            --card-bg: rgba(15, 35, 35, 0.95);
            --text-white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(255, 255, 255, 0.12);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animated Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(135deg, #001a1a 0%, #002a2a 50%, #001f1f 100%);
        }

        .wave {
            position: absolute;
            width: 200%;
            height: 200%;
            border-radius: 40%;
            opacity: 0.4;
            animation: drift linear infinite;
            transform-origin: 50% 50%;
        }

        .wave.one {
            top: -50%;
            left: -50%;
            background: rgba(0, 217, 163, 0.1);
            animation-duration: 25s;
        }

        .wave.two {
            top: -60%;
            left: -60%;
            background: rgba(0, 150, 136, 0.15);
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .wave.three {
            top: -70%;
            left: -70%;
            background: rgba(0, 217, 163, 0.05);
            animation-duration: 35s;
        }

        @keyframes drift {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            from {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            50% {
                opacity: 0.6;
            }

            to {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        /* Low Power Mode / Reduced Motion */
        @media (prefers-reduced-motion: reduce) {

            .wave,
            .particle {
                animation: none !important;
                display: none !important;
            }
        }

        body.low-power .particle {
            display: none;
        }

        body.low-power .wave {
            animation-duration: 60s;
        }

        /* Login Card */
        .login-card {
            width: 90%;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
            animation: card-enter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 72px;
            height: 72px;
            display: block;
            filter: drop-shadow(0 4px 20px rgba(0, 179, 134, 0.3));
        }

        .app-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .tagline {
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Language Switcher */
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 4px;
            display: flex;
            gap: 4px;
            z-index: 20;
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.2s;
        }

        .lang-btn.active {
            color: var(--text-white);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* Form Elements */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            margin-left: 4px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        input {
            width: 100%;
            padding: 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-white);
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.16);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 179, 134, 0.15);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        button.primary-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s;
            box-shadow: 0 4px 15px rgba(0, 179, 134, 0.3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        button.primary-btn:active {
            transform: scale(0.98);
        }

        button.primary-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        button.primary-btn:hover::after {
            left: 100%;
        }

        /* Footer */
        .footer {
            margin-top: 32px;
            text-align: center;
        }

        .footer p {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
        }

        .verification {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* High Contrast Mode */
        @media (prefers-contrast: high) {
            input {
                background: rgba(255, 255, 255, 0.25);
                border: 2px solid white;
            }

            button.primary-btn {
                border: 2px solid white;
            }

            label,
            .tagline,
            .footer p {
                color: white !important;
                opacity: 1;
            }
        }

        /* Accessibility Focus */
        :focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }
    </style>
    <!-- 
      PLAYWRIGHT TESTING: Append ?testMode=true to URL for headless CI/CD
      - Disables all CSS animations (prevents screenshot flakiness/timeouts)
      - Hides animated background elements
      - Auto-fills OTP with "123456" and submits automatically
      Example: await page.goto('https://wali.ci/login?testMode=true');
    -->
    <script>
        // Test Mode Logic (Injected immediately)
        const isTestMode = new URLSearchParams(window.location.search).has('testMode');
        if (isTestMode) {
            // Inject critical CSS to kill animations before render
            const style = document.createElement('style');
            style.textContent = `
                *,*::before,*::after{animation-duration:0.001s!important;transition-duration:0.001s!important}
                .bg-container,.wave,.particle,.glow{display:none!important}
                .login-card{animation:none!important;opacity:1!important;transform:none!important}
            `;
            document.head.appendChild(style);

            // Expose test config
            window.__WALI_TEST_CONFIG__ = { mockOTP: '123456', autoFill: true };
        }
    </script>
</head>

<body>

    <!-- Background Animation -->
    <div class="bg-container">
        <div class="wave one"></div>
        <div class="wave two"></div>
        <div class="wave three"></div>
        <!-- Particles will be generated by JS -->
    </div>

    <!-- Language Switcher -->
    <div class="lang-switcher" role="group" aria-label="Language selector">
        <button class="lang-btn active" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="dyu">DYU</button>
        <button class="lang-btn" data-lang="bci">BCI</button>
    </div>

    <!-- Login Card -->
    <div class="login-card">
        <div class="logo-container">
            <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
                aria-label="Wali Logo">
                <rect x="2" y="2" width="44" height="44" rx="14" fill="white" />
                <path d="M12 28 Q18 16 24 22 Q30 16 36 28" stroke="#00b386" stroke-width="5.5" stroke-linecap="round"
                    stroke-linejoin="round" fill="none" />
            </svg>
        </div>

        <h1 class="app-title">wali</h1>
        <p class="tagline" data-i18n="tagline">Micro-assurance pour les artisans</p>

        <!-- Step 1: Phone -->
        <form id="phoneForm" onsubmit="handleSendCode(event)">
            <div class="input-group">
                <label for="phone" data-i18n="phoneLabel">Numéro de téléphone</label>
                <input type="tel" id="phone" data-testid="phone-input" placeholder="+225 07 07 07 07 07" required
                    autocomplete="tel">
            </div>
            <button type="submit" class="primary-btn" data-testid="submit-phone">
                <span data-i18n="getCode">Recevoir le code</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </button>
        </form>

        <!-- Step 2: OTP (Hidden initially) -->
        <form id="otpForm" style="display: none;" onsubmit="handleVerifyCode(event)">
            <div class="input-group">
                <label for="otp">Code de vérification</label>
                <input type="text" id="otp" data-testid="otp-input" placeholder="• • • • • •" maxlength="6"
                    style="letter-spacing: 0.5em; text-align: center;">
            </div>
            <button type="submit" class="primary-btn" data-testid="verify-otp">
                <span>Confirmer</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
            </button>
            <button type="button" onclick="resetForm()"
                style="width:100%; margin-top:16px; background:none; border:none; color:rgba(255,255,255,0.6); cursor:pointer;">Retour</button>
        </form>

        <div class="footer">
            <div class="verification">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span data-i18n="captcha">Vérifié par reCAPTCHA</span>
            </div>
            <p>
                <span data-i18n="noAccount">Pas encore de compte ?</span>
                <a href="#" style="color:white; font-weight:600;" data-i18n="createAccount">Créer un compte</a>
            </p>
            <p data-i18n="terms">En vous connectant vous acceptez nos conditions d'utilisation et notre politique de
                confidentialité</p>
            <p style="margin-top:20px; font-size:11px;">
                <a href="#" data-i18n="needHelp">Besoin d'aide ?</a> •
                <a href="#" data-i18n="contactUs">Contactez nous</a>
            </p>
            <p style="opacity:0.4; margin-top:8px;">&copy; 2025 Wali. <span data-i18n="rights">Tous droits
                    réservés.</span></p>
        </div>
    </div>

    <script>
        // --- 1. Translations ---
        const translations = {
            fr: { tagline: "Micro-assurance pour les artisans", phoneLabel: "Numéro de téléphone", getCode: "Recevoir le code", connectionProblem: "Problème de connexion ?", captcha: "Vérifié par reCAPTCHA", noAccount: "Pas encore de compte ?", createAccount: "Créer un compte", terms: "En vous connectant vous acceptez nos conditions d'utilisation et notre politique de confidentialité", needHelp: "Besoin d'aide ?", contactUs: "Contactez nous", rights: "Tous droits réservés." },
            en: { tagline: "Micro-insurance for artisans", phoneLabel: "Phone number", getCode: "Get code", connectionProblem: "Connection trouble?", captcha: "Protected by reCAPTCHA", noAccount: "No account yet?", createAccount: "Create account", terms: "By logging in you accept our terms of use and privacy policy", needHelp: "Need help?", contactUs: "Contact us", rights: "All rights reserved." },
            dyu: { tagline: "Kɔlɔsɔli fitini ni ɲɔgɔn cɛ", phoneLabel: "Telefoni nimɔrɔ", getCode: "Kode sɔrɔ", connectionProblem: "Connection problematic ?", captcha: "reCAPTCHA yɛrɛmahɔrɔnya", noAccount: "Si ɲɛ tɛ ?", createAccount: "Kɔntɔkiri dɔ bɔ", terms: "Ni i bɛ don, i yɛrɛmahɔrɔnya sariya ni privacy policy yɛrɛmahɔrɔnya", needHelp: "Dɛmɛ sɔrɔ ?", contactUs: "Anw bɛ wele", rights: "Koloma bɛɛ ka kan." },
            bci: { tagline: "Assurance ndɛn ndɛn mɛn denlɛ", phoneLabel: "Telefoni nimɛrɔ", getCode: "Code mlɛ", connectionProblem: "Connection ɛn ɛ kɔnɔ ?", captcha: "reCAPTCHA sɛ", noAccount: "Compte mma ?", createAccount: "Compte mlɛ", terms: "Nɛnɛ i connecter, i sɛ conditions d'utilisation ni politique confidentialité sɛ", needHelp: "Bɛ dɛ ?", contactUs: "Bɛ wa wlɛ", rights: "Copyright 2025 Wali." }
        };

        const langBtns = document.querySelectorAll('.lang-btn');
        const elementsInDom = document.querySelectorAll('[data-i18n]');

        function setLanguage(lang) {
            // Update Text
            elementsInDom.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
            // Update UI
            langBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
            // Save
            localStorage.setItem('vali_lang', lang);
        }

        langBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const lang = e.target.getAttribute('data-lang');
                setLanguage(lang);
            });
        });

        // Initialize Language
        const savedLang = localStorage.getItem('vali_lang') || 'fr';
        setLanguage(savedLang);

        // --- 2. Animations & Performance ---
        const bgContainer = document.querySelector('.bg-container');
        const isLowPower = navigator.hardwareConcurrency <= 4 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (isLowPower) document.body.classList.add('low-power');

        if (!isLowPower && !isTestMode) {
            // Create Particles
            const particleCount = window.innerWidth < 768 ? 10 : 20;
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 5 + 5) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                bgContainer.appendChild(p);
            }
        }

        // --- 3. Form Logic ---
        function handleSendCode(e) {
            e.preventDefault();
            document.getElementById('phoneForm').style.display = 'none';
            document.getElementById('otpForm').style.display = 'block';

            // Trigger Test Mode Auto-Fill if applicable
            // (Handled by MutationObserver in body script)
        }

        function handleVerifyCode(e) {
            e.preventDefault();
            alert('Code verified! (Simulation)');
        }

        function resetForm() {
            document.getElementById('otpForm').style.display = 'none';
            document.getElementById('phoneForm').style.display = 'block';
        }

        // --- 4. Test Mode Auto-Fill Observer ---
        if (window.__WALI_TEST_CONFIG__?.autoFill) {
            // Watch for OTP input appearance
            const observer = new MutationObserver((mutations, obs) => {
                const otpInput = document.querySelector('[data-testid="otp-input"]');
                const verifyBtn = document.querySelector('[data-testid="verify-otp"]');

                if (otpInput && !otpInput.value) {
                    otpInput.value = window.__WALI_TEST_CONFIG__.mockOTP;
                    otpInput.dispatchEvent(new Event('input', { bubbles: true }));

                    setTimeout(() => verifyBtn?.click(), 100);
                    obs.disconnect(); // Run once
                }
            });

            observer.observe(document.body, { childList: true, subtree: true });
        }
    </script>
</body>

</html>
